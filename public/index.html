<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gameteste 3D Rebuild</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#fff;font-family:Inter,system-ui,Arial}
#view{width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:16px;top:16px;z-index:3;background:#0b1118dd;border:1px solid #ffffff20;border-radius:14px;padding:12px 14px;backdrop-filter:blur(10px);max-width:360px}
.hud b{display:block;margin-bottom:6px}.hud small{display:block;opacity:.78;line-height:1.45}
.cross{position:fixed;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);pointer-events:none;z-index:10;filter:drop-shadow(0 1px 1px #000a)}
.cross::before{content:"";position:absolute;left:7px;top:7px;width:14px;height:14px;border:2px solid #ffffffdd;border-radius:50%}
.cross::after{content:"";position:absolute;inset:0;background:
linear-gradient(#ffffffdd,#ffffffdd) center 0/2px 10px no-repeat,
linear-gradient(#ffffffdd,#ffffffdd) center 22px/2px 10px no-repeat,
linear-gradient(90deg,#ffffffdd,#ffffffdd) 0 center/10px 2px no-repeat,
linear-gradient(90deg,#ffffffdd,#ffffffdd) 22px center/10px 2px no-repeat}
#state{position:fixed;right:16px;top:16px;background:#0b1118dd;border:1px solid #ffffff20;border-radius:12px;padding:10px 12px;font:600 12px/1.4 system-ui}
#help{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b1118dd;border:1px solid #ffffff20;border-radius:999px;padding:8px 12px;font-size:12px;opacity:.9}

.cross{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;filter:drop-shadow(0 1px 1px #000b)}
.cross-ring{position:absolute;left:8px;top:8px;width:14px;height:14px;border:2px solid #fff;border-radius:50%;box-sizing:border-box}
.cross-line{position:absolute;background:#fff;border-radius:2px;box-shadow:0 0 1px #000}
.cross-top{width:2px;height:10px;left:16px;top:0}
.cross-bottom{width:2px;height:10px;left:16px;bottom:0}
.cross-left{width:10px;height:2px;left:0;top:16px}
.cross-right{width:10px;height:2px;right:0;top:16px}

.combat-hud{min-width:300px}.hud-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.hud-grid span{font-size:10px;opacity:.8}.hud-grid strong{display:block;font-size:13px;color:#7ee8ff;margin-top:2px}.stamina-wrap{font-size:10px;margin:8px 0}.stamina-track{height:7px;background:#12202a;border-radius:999px;overflow:hidden;margin-top:4px}.stamina-track>div{height:100%;width:100%;background:#22d3ee;transition:width .08s linear}
#hitmarker{position:fixed;left:50%;top:50%;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none;z-index:10000;opacity:0}
#hitmarker.active{animation:hitmark .16s ease-out}
#hitmarker i{position:absolute;width:9px;height:2px;background:#ff3366}
#hitmarker i:nth-child(1){left:2px;top:5px;transform:rotate(45deg)}
#hitmarker i:nth-child(2){right:2px;top:5px;transform:rotate(-45deg)}
#hitmarker i:nth-child(3){left:2px;bottom:5px;transform:rotate(-45deg)}
#hitmarker i:nth-child(4){right:2px;bottom:5px;transform:rotate(45deg)}
@keyframes hitmark{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
.cross-ring,.cross-line{border-color:#00ffcc!important;background:#00ffcc!important;box-shadow:0 0 8px #00ffcc!important}

#aventura-menu-overlay{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 65% 35%,rgba(45,55,85,.75) 0%,rgba(13,18,32,.96) 70%),linear-gradient(to bottom,#0b1021 0%,#1c2541 60%,#2a324b 100%);color:#f3e9d2;transition:opacity .5s,visibility .5s;overflow:hidden}
#aventura-menu-overlay.hidden-menu{opacity:0;visibility:hidden;pointer-events:none}
.menu-mountains{position:absolute;bottom:0;left:0;width:100%;height:45%;background:linear-gradient(to top,rgba(15,23,42,.95),transparent);clip-path:polygon(0 100%,0 55%,18% 35%,35% 60%,52% 45%,78% 25%,100% 50%,100% 100%);z-index:1}
#menu-particles-canvas{position:absolute;inset:0;z-index:2;pointer-events:none}
.menu-content{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px;padding:20px}
.menu-title{font-weight:300;font-size:4.2rem;letter-spacing:.22em;color:#ead3a8;text-shadow:0 0 28px rgba(234,211,168,.35);margin-bottom:3rem}
.menu-stack{display:flex;flex-direction:column;gap:1.1rem;width:280px}
.menu-btn{position:relative;background:rgba(15,23,42,.45);border:1px solid rgba(212,175,110,.65);color:#f5efe6;padding:.9rem 1.5rem;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.25s;box-shadow:0 4px 15px rgba(0,0,0,.3),inset 0 0 12px rgba(212,175,110,.08)}
.menu-btn:hover{background:rgba(212,175,110,.18);border-color:#f3d59b;transform:translateY(-1px)}
.menu-btn-secondary{border-color:rgba(148,163,184,.4);color:#cbd5e1;font-size:.85rem;padding:.65rem 1rem}
.menu-panel-box{background:rgba(12,18,34,.82);border:1px solid rgba(212,175,110,.5);padding:1.5rem;width:340px;display:flex;flex-direction:column;gap:1rem;box-shadow:0 10px 35px rgba(0,0,0,.6)}
.menu-input{background:rgba(15,23,42,.8);border:1px solid rgba(212,175,110,.45);color:#f8fafc;padding:.65rem .85rem;font-size:.9rem;outline:none;width:100%;box-sizing:border-box}
.menu-label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#ead3a8;margin-bottom:.25rem;display:block}
.hidden-view{display:none!important}
.menu-version{position:absolute;bottom:18px;right:24px;z-index:10;font-size:.85rem;color:rgba(234,211,168,.55)}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="aventura-menu-overlay">
  <div class="menu-mountains"></div>
  <canvas id="menu-particles-canvas"></canvas>
  <div class="menu-content">
    <h1 class="menu-title">AVENTURA</h1>
    <div id="view-main" class="menu-stack">
      <button id="btn-menu-play" class="menu-btn">JOGAR</button>
      <button id="btn-menu-settings" class="menu-btn">CONFIGURAÇÕES</button>
      <button id="btn-menu-exit" class="menu-btn">SAIR</button>
    </div>
    <div id="view-modes" class="menu-stack hidden-view">
      <button id="btn-mode-solo" class="menu-btn">MODO SOLO</button>
      <button id="btn-mode-multi" class="menu-btn">MULTIPLAYER</button>
      <button id="btn-modes-back" class="menu-btn menu-btn-secondary">VOLTAR</button>
    </div>
    <div id="view-multiplayer" class="menu-panel-box hidden-view">
      <div><label class="menu-label">Seu Nome</label><input id="input-player-name" class="menu-input" maxlength="16"></div>
      <button id="btn-create-room" class="menu-btn">CRIAR SALA</button>
      <div><label class="menu-label">Código da Sala</label><input id="input-room-code" class="menu-input" maxlength="8"></div>
      <button id="btn-join-room" class="menu-btn">ENTRAR</button>
      <div id="multi-status-msg" style="font-size:.78rem;color:#34d399;text-align:center;min-height:18px"></div>
      <button id="btn-multi-back" class="menu-btn menu-btn-secondary">VOLTAR</button>
    </div>
    <div id="view-settings" class="menu-panel-box hidden-view">
      <div><label class="menu-label">Áudio Ambiente e Efeitos</label><button id="btn-toggle-audio" class="menu-btn">SOM: ATIVADO</button></div>
      <div><label class="menu-label">Sensibilidade: <span id="lbl-sens">1.0</span></label><input id="range-sens" type="range" min=".3" max="2.5" step=".1" value="1.0" style="width:100%"></div>
      <div><label class="menu-label">Sombras</label><button id="btn-toggle-shadows" class="menu-btn">SOMBRAS: ATIVADAS</button></div>
      <button id="btn-settings-back" class="menu-btn menu-btn-secondary">SALVAR E VOLTAR</button>
    </div>
  </div>
  <div class="menu-version">v1.0</div>
</div>
<div class="hud combat-hud">
  <b>Gameteste — Floresta 3D</b>
  <div class="hud-grid">
    <span>PONTOS <strong id="score">0</strong></span>
    <span>ACERTOS/TIROS <strong id="hits">0 / 0</strong></span>
    <span>ESTADO <strong id="playerState">Parado</strong></span>
    <span>VELOCIDADE <strong id="speed">0.0 m/s</strong></span>
    <span>ALTITUDE <strong id="altitude">0.0 m</strong></span>
  </div>
  <div class="stamina-wrap"><span>STAMINA</span><div class="stamina-track"><div id="staminaBar"></div></div></div>
  <small>WASD mover • Shift correr • Espaço pular • botão direito gira câmera • clique esquerdo atirar</small>
</div>
<div id="state">carregando...</div>
<div id="hitmarker" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<div id="help">Nova versão 3D — versão anterior preservada em backup</div>
<div class="cross" aria-hidden="true">
  <span class="cross-ring"></span>
  <span class="cross-line cross-top"></span>
  <span class="cross-line cross-bottom"></span>
  <span class="cross-line cross-left"></span>
  <span class="cross-line cross-right"></span>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="/full3d.js?v=4"></script>
</body>
</html>
