name: Test climbing
on:
  push:
    branches: [main]
    paths:
      - 'public/climb-rules.js'
      - 'public/full3d.js'
      - 'public/index.html'
      - 'tests/climbing.test.cjs'
      - '.github/workflows/test-climbing.yml'
  workflow_dispatch:
jobs:
  climbing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check public/climb-rules.js
          node --check public/full3d.js
      - name: Climbing collision and interpolation tests
        run: node tests/climbing.test.cjs
      - name: Verify game wiring
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('public/index.html','utf8');
          const js=fs.readFileSync('public/full3d.js','utf8');
          for(const marker of ['climb-rules.js','Espaço pular/escalar','F criar gelo'])if(!html.includes(marker))throw Error('Missing climbing UI: '+marker);
          for(const marker of ['jumpOrClimb()','startClimb()','climbPosition(', "case 'Space':", "e.code==='KeyF')tacticalGear.deployIce()"])if(!js.includes(marker))throw Error('Missing climbing integration: '+marker);
          console.log('Climbing wiring verified');
          NODE
