name: Validate browser game
on:
  workflow_call:
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check all game and server JavaScript
        run: npm run check
      - name: Run complete regression suite
        run: npm test
